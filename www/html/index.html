<!-- File: my-llm-wiki/www/html/index.html -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 My LLM-Wiki | 第二大腦查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
            color: #f8fafc;
        }

        .prose h2 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.25rem;
        }

        .prose p,
        .prose li {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .prose ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose blockquote {
            border-left: 4px solid #38bdf8;
            padding-left: 1rem;
            color: #94a3b8;
            font-style: italic;
            margin: 1rem 0;
            background: #1e293b;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
        }

        .wiki-link {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 0.1rem 0.45rem;
            border-radius: 0.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .wiki-link:hover {
            background: rgba(56, 189, 248, 0.28);
            text-decoration: underline;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽與搜尋列 -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🧠</span>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">MY-LLM-WIKI</h1>
                    <p id="ws-status" class="text-xs text-amber-400">正在連線 WebSocket...</p>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input id="search-input" type="text" placeholder="搜尋概念、工具、關鍵字 (例如: karpathy, claude)..."
                    class="w-full sm:w-80 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-sky-400 text-slate-100" />
                <button onclick="loadIndex()"
                    class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-lg text-sm whitespace-nowrap">
                    🗺️ 全域地圖
                </button>
                <button onclick="loadSlug('log')"
                    class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-lg text-sm whitespace-nowrap">
                    📜 日誌
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 grid grid-cols-1 md:grid-cols-3 gap-6 flex-1">
        <!-- 左側：搜尋結果清單 -->
        <aside class="md:col-span-1 border border-slate-800 bg-slate-950/50 rounded-xl p-4 h-fit">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">條目列表</h2>
                <span id="result-count" class="text-xs bg-slate-800 text-sky-400 px-2 py-0.5 rounded-full">0</span>
            </div>
            <div id="result-list" class="space-y-2 max-h-[70vh] overflow-y-auto"></div>
        </aside>

        <!-- 右側：知識條目內容檢視器 -->
        <section class="md:col-span-2 border border-slate-800 bg-slate-950/50 rounded-xl p-6">
            <div id="article-meta" class="mb-4 pb-3 border-b border-slate-800 hidden">
                <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                    <span id="meta-category"
                        class="bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded uppercase font-semibold"></span>
                    <span id="meta-path" class="font-mono"></span>
                </div>
            </div>
            <article id="article-viewer" class="prose max-w-none">
                <p class="text-slate-500">請從左側選擇條目，或在上方輸入關鍵字即時查詢。</p>
            </article>
        </section>
    </main>

    <script>
        let ws;
        let currentEntries = [];
        const statusEl = document.getElementById('ws-status');
        const searchInput = document.getElementById('search-input');
        const resultList = document.getElementById('result-list');
        const resultCount = document.getElementById('result-count');
        const viewer = document.getElementById('article-viewer');
        const metaBox = document.getElementById('article-meta');

        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                statusEl.textContent = '🟢 WebSocket 已連線 (SherryServer)';
                statusEl.className = 'text-xs text-emerald-400';
                loadIndex(); // 預設載入 index.md
            };

            ws.onmessage = (event) => {
                const res = JSON.parse(event.data);
                if (res.type === 'results') {
                    currentEntries = res.results || [];
                    renderList(currentEntries);
                    if (currentEntries.length > 0) {
                        renderArticle(currentEntries[0]);
                    } else {
                        metaBox.classList.add('hidden');
                        viewer.innerHTML = `<p class="text-slate-500">找不到符合的知識條目。</p>`;
                    }
                }
            };

            ws.onclose = () => {
                statusEl.textContent = '🔴 WebSocket 已斷線，3 秒後重連...';
                statusEl.className = 'text-xs text-rose-400';
                setTimeout(connectWS, 3000);
            };
        }

        function sendQuery(action, query = '') {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action, query }));
            }
        }

        function loadIndex() {
            searchInput.value = '';
            sendQuery('index');
        }

        function loadSlug(slug) {
            sendQuery('get', slug);
        }

        // 渲染左側清單
        function renderList(entries) {
            resultCount.textContent = entries.length;
            resultList.innerHTML = entries.map((item, idx) => `
                <div onclick="renderArticle(currentEntries[${idx}])"
                     class="p-3 rounded-lg border border-slate-800/80 hover:border-sky-500/50 bg-slate-900/60 hover:bg-slate-800/60 cursor-pointer transition">
                    <div class="flex items-center justify-between">
                        <span class="font-medium text-sm text-slate-200">${item.title}</span>
                        <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">${item.category}</span>
                    </div>
                    <p class="text-xs text-slate-500 font-mono mt-1">[[${item.slug}]]</p>
                </div>
            `).join('');
        }

        // 渲染右側 Markdown 內容 (支援 YAML 過濾與 [[wiki-link]] 雙向連結轉換)
        function renderArticle(entry) {
            metaBox.classList.remove('hidden');
            document.getElementById('meta-category').textContent = entry.category;
            document.getElementById('meta-path').textContent = entry.path;

            // 移除開頭的 YAML Frontmatter (--- ... ---)
            let cleanMd = entry.content.replace(/^---[\s\S]*?---\n*/, '');

            // 將 [[slug]] 轉換為可點擊的 HTML 標籤
            cleanMd = cleanMd.replace(/\[\[([^\]]+)\]\]/g, (match, slug) => {
                return `<span class="wiki-link" onclick="loadSlug('${slug.trim()}')">[[${slug.trim()}]]</span>`;
            });

            viewer.innerHTML = marked.parse(cleanMd);
        }

        // 綁定輸入框即時搜尋
        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            if (q === '') {
                loadIndex();
            } else {
                sendQuery('search', q);
            }
        });

        connectWS();
    </script>
</body>

</html>
